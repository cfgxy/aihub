<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- Gmail Creator Pro 原创内容区插图 v2（中性队列 → 风险边界；关键披露大字号，375px 显示宽可辨） -->
  <defs>
    <pattern id="fdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#c7d2fe" opacity="0.5"/>
    </pattern>
    <filter id="fcardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.059  0 0 0 0 0.09  0 0 0 0 0.165  0 0 0 0.10 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="farrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1.5 1 L10.5 6 L1.5 11 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect width="1200" height="675" fill="url(#fdots)"/>
  <circle cx="1120" cy="60" r="170" fill="#eef2ff" opacity="0.55"/>
  <circle cx="60" cy="640" r="150" fill="#eef2ff" opacity="0.5"/>

  <!-- 顶部 kicker（站点 section-kicker 同款） -->
  <text x="64" y="76" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#4f46e5">EMAIL AUTOMATION TOOL</text>

  <!-- 悬浮邮件块 -->
  <g filter="url(#fcardShadow)">
    <g transform="translate(524,54)">
      <rect width="80" height="84" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <g transform="translate(20,27)">
        <rect width="40" height="30" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
        <path d="M1 3 L 20 18 L 39 3" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 左：自动化队列面板 -->
  <g transform="translate(64,128)" filter="url(#fcardShadow)">
    <rect width="400" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M0 14 C 0 6.3, 6.3 0, 14 0 H 386 C 393.7 0, 400 6.3, 400 14 V 46 H 0 Z" fill="#111827"/>
    <circle cx="24" cy="23" r="4.5" fill="#64748b"/>
    <circle cx="40" cy="23" r="4.5" fill="#64748b"/>
    <circle cx="56" cy="23" r="4.5" fill="#64748b"/>
    <g transform="translate(336,10)">
      <rect width="46" height="26" rx="7" fill="#4f46e5"/>
      <circle cx="15" cy="13" r="3" fill="#eef2ff"/>
      <circle cx="23" cy="13" r="3" fill="#eef2ff"/>
      <circle cx="31" cy="13" r="3" fill="#eef2ff"/>
    </g>
    <!-- 队列行 ×4 -->
    <g transform="translate(20,66)">
      <g>
        <rect width="360" height="54" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(13,13)">
          <rect width="38" height="27" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.8"/>
          <path d="M1 2 L 19 16 L 37 2" fill="none" stroke="#4f46e5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="66" y="21" width="160" height="12" rx="6" fill="#e2e8f0"/>
        <rect x="286" y="17" width="58" height="20" rx="10" fill="#c7d2fe"/>
      </g>
      <g transform="translate(0,66)">
        <rect width="360" height="54" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(13,13)">
          <rect width="38" height="27" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2.8"/>
          <path d="M1 2 L 19 16 L 37 2" fill="none" stroke="#818cf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="66" y="21" width="130" height="12" rx="6" fill="#e2e8f0"/>
        <rect x="286" y="17" width="58" height="20" rx="10" fill="#e2e8f0"/>
      </g>
      <g transform="translate(0,132)">
        <rect width="360" height="54" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(13,13)">
          <rect width="38" height="27" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2.8"/>
          <path d="M1 2 L 19 16 L 37 2" fill="none" stroke="#818cf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="66" y="21" width="110" height="12" rx="6" fill="#e2e8f0"/>
        <rect x="286" y="17" width="58" height="20" rx="10" fill="#e2e8f0"/>
      </g>
      <g transform="translate(0,198)">
        <rect width="360" height="54" rx="9" fill="#fffbeb" stroke="#fde68a"/>
        <g transform="translate(13,13)">
          <rect width="38" height="27" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="2.8"/>
          <path d="M1 2 L 19 16 L 37 2" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="66" y="21" width="96" height="12" rx="6" fill="#fde68a"/>
        <g transform="translate(286,17)">
          <rect width="58" height="20" rx="10" fill="#fde68a"/>
          <rect x="21" y="5" width="5" height="10" rx="2" fill="#b45309"/>
          <rect x="31" y="5" width="5" height="10" rx="2" fill="#b45309"/>
        </g>
      </g>
    </g>
    <!-- 面板底部中性条 -->
    <g transform="translate(20,340)">
      <rect width="360" height="24" rx="9" fill="#f1f5f9"/>
      <rect x="10" y="7" width="150" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- 连接线：队列 → 风险边界 -->
  <line x1="464" y1="328" x2="596" y2="328" stroke="#818cf8" stroke-width="3.5" marker-end="url(#farrow)"/>
  <circle cx="530" cy="328" r="4.5" fill="#4f46e5"/>

  <!-- 右：风险边界卡（大字号关键披露） -->
  <g transform="translate(620,128)" filter="url(#fcardShadow)">
    <rect width="516" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- 盾牌 + 警示符 -->
    <g transform="translate(258,124)">
      <path d="M0 -70 C 20 -58, 45 -51, 62 -51 C 62 -10, 46 34, 0 63 C -46 34, -62 -10, -62 -51 C -45 -51, -20 -58, 0 -70 Z"
            fill="#eef2ff" stroke="#4f46e5" stroke-width="5" stroke-linejoin="round"/>
      <rect x="-7" y="-36" width="14" height="46" rx="7" fill="#d97706"/>
      <circle cx="0" cy="27" r="8" fill="#d97706"/>
    </g>
    <text x="258" y="262" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="40" font-weight="700" fill="#92400e">谨慎使用 · 风险自负</text>
    <text x="258" y="318" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="42" font-weight="700" fill="#475569">未经独立安全审计</text>
    <text x="258" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="42" font-weight="700" fill="#475569">非 Google 官方工具</text>
  </g>

  <!-- 左下点缀 -->
  <g transform="translate(64,596)" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="30" y2="0"/>
    <line x1="40" y1="0" x2="70" y2="0"/>
    <line x1="80" y1="0" x2="110" y2="0"/>
  </g>
</svg>
