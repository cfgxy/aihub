<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#dbe3f4"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- ===== 论文纸张 ===== -->
  <g transform="translate(150 118) rotate(-4 170 180)">
    <rect x="10" y="14" width="340" height="364" rx="16" fill="#0f172a" opacity="0.07" filter="url(#soft)"/>
    <rect width="340" height="364" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- 书签缎带：阅读进度 -->
    <path d="M296 0 h34 v52 l-17 -12 -17 12 Z" fill="#6d28d9"/>
    <!-- 标题条 -->
    <rect x="30" y="42" width="182" height="17" rx="8.5" fill="#94a3b8"/>
    <rect x="30" y="76" width="280" height="11" rx="5.5" fill="#e2e8f0"/>
    <rect x="30" y="99" width="256" height="11" rx="5.5" fill="#e2e8f0"/>
    <!-- 公式区：手绘 Σ 与等号线 -->
    <path d="M46 150 h30 l-19 17 19 17 h-30" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="156" width="64" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="92" y="174" width="44" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="196" y="150" width="14" height="14" fill="#0f172a"/>
    <rect x="30" y="204" width="270" height="11" rx="5.5" fill="#e2e8f0"/>
    <rect x="30" y="227" width="238" height="11" rx="5.5" fill="#e2e8f0"/>
    <!-- 证据高亮跨距 -->
    <rect x="30" y="262" width="216" height="20" rx="10" fill="#ddd6fe"/>
    <rect x="30" y="296" width="264" height="11" rx="5.5" fill="#e2e8f0"/>
    <rect x="30" y="319" width="200" height="11" rx="5.5" fill="#e2e8f0"/>
  </g>

  <!-- ===== 证据链：高亮跨距 → 定理节点 ===== -->
  <g fill="none">
    <path d="M368 390 L480 452 L596 420 L706 330" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="480" cy="452" r="7" fill="#7c3aed"/>
    <circle cx="596" cy="420" r="7" fill="#7c3aed"/>
  </g>

  <!-- ===== 阅读路径（虚线导览） ===== -->
  <path d="M500 130 C610 96 660 150 712 196" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="8 7" stroke-linecap="round"/>
  <path d="M836 246 C900 300 900 360 836 400" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="8 7" stroke-linecap="round"/>

  <!-- ===== 图谱连线 ===== -->
  <g stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round">
    <line x1="712" y1="252" x2="770" y2="228"/>
    <line x1="828" y1="268" x2="884" y2="244"/>
    <line x1="860" y1="322" x2="912" y2="330"/>
    <line x1="812" y1="366" x2="842" y2="416"/>
    <line x1="722" y1="360" x2="690" y2="418"/>
    <line x1="702" y1="296" x2="666" y2="290"/>
  </g>

  <!-- ===== 卫星节点 ===== -->
  <circle cx="770" cy="196" r="30" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
  <circle cx="640" cy="288" r="24" fill="#c7d2fe"/>
  <circle cx="884" cy="236" r="20" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="920" cy="332" r="26" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
  <circle cx="856" cy="436" r="22" fill="#c7d2fe"/>
  <circle cx="682" cy="436" r="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>

  <!-- ===== 主定理节点（QED 六边形） ===== -->
  <g>
    <polygon points="770,220 838,258 838,334 770,372 702,334 702,258" fill="#6d28d9"/>
    <rect x="756" y="282" width="28" height="28" fill="#ffffff"/>
  </g>

  <!-- ===== 阅读顺序标记 ===== -->
  <g font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="500" cy="130" r="14" fill="#4f46e5"/>
    <text x="500" y="136" fill="#ffffff">1</text>
    <circle cx="712" cy="196" r="14" fill="#4f46e5"/>
    <text x="712" y="202" fill="#ffffff">2</text>
    <circle cx="836" cy="400" r="14" fill="#4f46e5"/>
    <text x="836" y="406" fill="#ffffff">3</text>
  </g>

  <!-- ===== 本地工作区徽章（SQLite） ===== -->
  <g>
    <rect x="948" y="464" width="188" height="68" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <g fill="none" stroke="#7c3aed" stroke-width="3">
      <path d="M978 488 c0 -4 6 -7 14 -7 s14 3 14 7 v20 c0 4 -6 7 -14 7 s-14 -3 -14 -7 Z"/>
      <ellipse cx="992" cy="488" rx="14" ry="7"/>
      <line x1="978" y1="498" x2="978" y2="498"/>
    </g>
    <path d="M978 498 c0 4 6 7 14 7 s14 -3 14 -7" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <rect x="1018" y="486" width="98" height="10" rx="5" fill="#ddd6fe"/>
    <rect x="1018" y="506" width="72" height="10" rx="5" fill="#e2e8f0"/>
  </g>

  <!-- ===== 点缀 ===== -->
  <g stroke="#c7d2fe" stroke-width="3" stroke-linecap="round">
    <path d="M1030 130 v24 M1018 142 h24"/>
    <path d="M560 520 v20 M550 530 h20"/>
  </g>
  <circle cx="1076" cy="236" r="5" fill="#a5b4fc"/>
  <circle cx="470" cy="86" r="5" fill="#a5b4fc"/>
</svg>
