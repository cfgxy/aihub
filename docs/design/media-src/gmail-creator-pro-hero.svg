<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- Gmail Creator Pro 原创封面 v2（中性语义；关键披露大字号，360px 显示宽可辨；无 Gmail/Google 商标元素与背书文字） -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#c7d2fe" opacity="0.55"/>
    </pattern>
    <linearGradient id="bgSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e7ecff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.059  0 0 0 0 0.09  0 0 0 0 0.165  0 0 0 0.10 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="600" fill="url(#bgSheen)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <circle cx="1080" cy="70" r="170" fill="#ffffff" opacity="0.35"/>
  <circle cx="80" cy="545" r="150" fill="#ffffff" opacity="0.30"/>

  <!-- 左：自动化面板（中性队列） -->
  <g transform="translate(84,88)" filter="url(#cardShadow)">
    <rect width="470" height="320" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M0 14 C 0 6.3, 6.3 0, 14 0 H 456 C 463.7 0, 470 6.3, 470 14 V 46 H 0 Z" fill="#111827"/>
    <circle cx="24" cy="23" r="4.5" fill="#64748b"/>
    <circle cx="40" cy="23" r="4.5" fill="#64748b"/>
    <circle cx="56" cy="23" r="4.5" fill="#64748b"/>
    <g transform="translate(400,10)">
      <rect width="46" height="26" rx="7" fill="#4f46e5"/>
      <circle cx="15" cy="13" r="3" fill="#eef2ff"/>
      <circle cx="23" cy="13" r="3" fill="#eef2ff"/>
      <circle cx="31" cy="13" r="3" fill="#eef2ff"/>
    </g>
    <!-- 队列行 ×3 -->
    <g transform="translate(22,64)">
      <g>
        <rect width="426" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(14,14)">
          <rect width="40" height="28" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.8"/>
          <path d="M1 2 L 20 17 L 39 2" fill="none" stroke="#4f46e5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="70" y="22" width="190" height="12" rx="6" fill="#e2e8f0"/>
        <rect x="348" y="18" width="60" height="20" rx="10" fill="#c7d2fe"/>
      </g>
      <g transform="translate(0,68)">
        <rect width="426" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(14,14)">
          <rect width="40" height="28" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2.8"/>
          <path d="M1 2 L 20 17 L 39 2" fill="none" stroke="#818cf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="70" y="22" width="150" height="12" rx="6" fill="#e2e8f0"/>
        <rect x="348" y="18" width="60" height="20" rx="10" fill="#e2e8f0"/>
      </g>
      <g transform="translate(0,136)">
        <rect width="426" height="56" rx="9" fill="#fffbeb" stroke="#fde68a"/>
        <g transform="translate(14,14)">
          <rect width="40" height="28" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="2.8"/>
          <path d="M1 2 L 20 17 L 39 2" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="70" y="22" width="130" height="12" rx="6" fill="#fde68a"/>
        <g transform="translate(348,18)">
          <rect width="60" height="20" rx="10" fill="#fde68a"/>
          <rect x="22" y="5" width="5" height="10" rx="2" fill="#b45309"/>
          <rect x="32" y="5" width="5" height="10" rx="2" fill="#b45309"/>
        </g>
      </g>
    </g>
    <!-- 底部中性条 -->
    <g transform="translate(22,282)">
      <rect width="426" height="22" rx="9" fill="#f1f5f9"/>
      <rect x="10" y="6" width="170" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- 右：警示卡（大字号关键披露） -->
  <g transform="translate(594,88)" filter="url(#cardShadow)">
    <rect width="522" height="320" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- 警示三角 -->
    <g transform="translate(261,90)">
      <path d="M0 -46 L 40 26 C 43 32, 39 39, 32 39 H -32 C -39 39, -43 32, -40 26 Z" fill="#fef3c7" stroke="#d97706" stroke-width="4.5" stroke-linejoin="round"/>
      <rect x="-4.5" y="-26" width="9" height="30" rx="4.5" fill="#b45309"/>
      <circle cx="0" cy="14" r="5.5" fill="#b45309"/>
    </g>
    <text x="261" y="196" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="46" font-weight="700" fill="#92400e">谨慎使用</text>
    <text x="261" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="40" font-weight="700" fill="#475569">未经独立安全审计</text>
  </g>

  <!-- 底部声明带：展示名 + 非官方归属（大字号，移动端可辨） -->
  <g filter="url(#cardShadow)">
    <rect x="84" y="432" width="1032" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="116" y="482" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Gmail Creator Pro</text>
    <line x1="580" y1="446" x2="580" y2="490" stroke="#e2e8f0" stroke-width="2"/>
    <text x="612" y="480" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="42" font-weight="700" fill="#475569">非 Google 官方工具</text>
  </g>
</svg>
