<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- AI-research-SKILLs 原创封面 · AIHub 设计体系（indigo #4f46e5 / #eef2ff，扁平卡片 1px #e2e8f0，8px 圆角） -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#c7d2fe" opacity="0.55"/>
    </pattern>
    <linearGradient id="bgSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e7ecff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.059  0 0 0 0 0.09  0 0 0 0 0.165  0 0 0 0.10 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1.5 1 L10.5 6 L1.5 11 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="600" fill="url(#bgSheen)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <circle cx="1075" cy="70" r="190" fill="#ffffff" opacity="0.35"/>
  <circle cx="95" cy="545" r="170" fill="#ffffff" opacity="0.30"/>

  <!-- 顶部技能横轨：技能块 → 横轨 → 三条落线汇入主流程 -->
  <g id="skill-rail">
    <!-- 落线 -->
    <g stroke="#818cf8" stroke-width="2.6">
      <line x1="236" y1="172" x2="236" y2="200"/>
      <line x1="600" y1="172" x2="600" y2="200"/>
      <line x1="964" y1="172" x2="964" y2="200"/>
    </g>
    <circle cx="236" cy="204" r="4" fill="#4f46e5"/>
    <circle cx="600" cy="204" r="4" fill="#4f46e5"/>
    <circle cx="964" cy="204" r="4" fill="#4f46e5"/>
    <!-- 横轨 -->
    <line x1="196" y1="170" x2="1004" y2="170" stroke="#c7d2fe" stroke-width="3"/>
    <!-- 技能块连接短杆 -->
    <g stroke="#c7d2fe" stroke-width="2.6">
      <line x1="236" y1="140" x2="236" y2="170"/>
      <line x1="418" y1="140" x2="418" y2="170"/>
      <line x1="600" y1="140" x2="600" y2="170"/>
      <line x1="782" y1="140" x2="782" y2="170"/>
      <line x1="964" y1="140" x2="964" y2="170"/>
    </g>
    <!-- 五个技能块 -->
    <g filter="url(#cardShadow)">
      <g transform="translate(200,66)">
        <rect width="72" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- 书本 -->
        <g stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(15,13)">
          <path d="M0 12 C 5 8, 13 8, 21 12 V 42 C 13 38, 5 38, 0 42 Z"/>
          <path d="M21 12 C 27 8, 35 8, 42 12 V 42 C 35 38, 27 38, 21 42"/>
          <line x1="21" y1="13" x2="21" y2="42"/>
        </g>
      </g>
      <g transform="translate(382,66)">
        <rect width="72" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- 代码括号 -->
        <g stroke="#6d28d9" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(15,13)">
          <path d="M14 8 L 2 22 L 14 36"/>
          <path d="M28 8 L 40 22 L 28 36"/>
        </g>
      </g>
      <g transform="translate(564,66)">
        <rect width="72" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- 数据节点 -->
        <g stroke="#4f46e5" stroke-width="2.8" fill="none" stroke-linecap="round" transform="translate(15,13)">
          <ellipse cx="21" cy="8" rx="14" ry="6"/>
          <path d="M7 8 V 36 C 7 40, 13 43, 21 43 C 29 43, 35 40, 35 36 V 8"/>
          <path d="M7 22 C 7 26, 13 29, 21 29 C 29 29, 35 26, 35 22"/>
        </g>
      </g>
      <g transform="translate(746,66)">
        <rect width="72" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- 图表 -->
        <g stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(15,13)">
          <path d="M0 42 H 42"/>
          <line x1="8" y1="36" x2="8" y2="24"/>
          <line x1="19" y1="36" x2="19" y2="14"/>
          <line x1="30" y1="36" x2="30" y2="30"/>
          <path d="M2 12 L 14 5 L 24 10 L 38 2" stroke="#6d28d9"/>
        </g>
      </g>
      <g transform="translate(928,66)">
        <rect width="72" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- 文档笔 -->
        <g transform="translate(15,13)">
          <rect x="0" y="4" width="30" height="38" rx="5" fill="none" stroke="#4f46e5" stroke-width="3"/>
          <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
            <line x1="6" y1="14" x2="24" y2="14"/>
            <line x1="6" y1="22" x2="20" y2="22"/>
            <line x1="6" y1="30" x2="24" y2="30"/>
          </g>
          <g transform="translate(28,18) rotate(45)">
            <rect x="-4" y="-16" width="8" height="22" rx="2.4" fill="#6d28d9"/>
            <path d="M-4 6 L 0 14 L 4 6 Z" fill="#6d28d9"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- 主流程三卡 -->
  <!-- 卡1 文献综述 -->
  <g transform="translate(104,206)" filter="url(#cardShadow)">
    <rect width="264" height="236" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <g transform="translate(52,26)">
      <!-- 叠放文档 -->
      <rect x="26" y="12" width="104" height="96" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
      <rect x="12" y="0" width="104" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round">
        <line x1="28" y1="22" x2="98" y2="22"/>
        <line x1="28" y1="38" x2="92" y2="38"/>
        <line x1="28" y1="54" x2="98" y2="54"/>
        <line x1="28" y1="70" x2="76" y2="70"/>
      </g>
      <!-- 迷你知识图谱 -->
      <g stroke="#818cf8" stroke-width="2.4" fill="#eef2ff">
        <line x1="118" y1="10" x2="140" y2="26"/>
        <line x1="140" y1="26" x2="126" y2="52"/>
        <line x1="118" y1="10" x2="126" y2="52"/>
        <circle cx="118" cy="10" r="6" stroke="#4f46e5"/>
        <circle cx="140" cy="26" r="6" stroke="#4f46e5"/>
        <circle cx="126" cy="52" r="6" stroke="#4f46e5"/>
      </g>
      <!-- 放大镜 -->
      <g transform="translate(96,62)">
        <circle cx="14" cy="14" r="17" fill="#ffffff" fill-opacity="0.6" stroke="#4f46e5" stroke-width="4"/>
        <line x1="26" y1="26" x2="42" y2="42" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(132,168)">
      <rect x="-62" y="-18" width="124" height="38" rx="8" fill="#eef2ff"/>
      <text x="0" y="8" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="23" font-weight="700" fill="#3730a3">文献综述</text>
    </g>
  </g>

  <!-- 箭头 1→2 -->
  <line x1="376" y1="324" x2="452" y2="324" stroke="#4f46e5" stroke-width="3.4" marker-end="url(#arrow)"/>
  <circle cx="414" cy="324" r="4" fill="#4f46e5"/>

  <!-- 卡2 实验验证 -->
  <g transform="translate(468,206)" filter="url(#cardShadow)">
    <rect width="264" height="236" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <g transform="translate(40,22)">
      <!-- 终端小窗（编码 Agent 底色） -->
      <g transform="translate(118,-2)">
        <rect width="92" height="64" rx="8" fill="#111827"/>
        <circle cx="14" cy="13" r="3.4" fill="#64748b"/>
        <circle cx="26" cy="13" r="3.4" fill="#64748b"/>
        <text x="12" y="44" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="700" fill="#e2e8f0">&gt;_</text>
      </g>
      <!-- 锥形瓶 -->
      <g transform="translate(16,18)">
        <g stroke="#4f46e5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 0 V 34 L 2 76 C -2 84, 3 92, 12 92 H 62 C 71 92, 76 84, 72 76 L 52 34 V 0"/>
          <line x1="14" y1="0" x2="60" y2="0"/>
        </g>
        <path d="M12 62 L 2 76 C -2 84, 3 92, 12 92 H 62 C 71 92, 76 84, 72 76 L 62 62 Z" fill="#a5b4fc"/>
        <circle cx="34" cy="52" r="4" fill="#a5b4fc"/>
        <circle cx="46" cy="40" r="3" fill="#c7d2fe"/>
      </g>
    </g>
    <g transform="translate(132,168)">
      <rect x="-62" y="-18" width="124" height="38" rx="8" fill="#eef2ff"/>
      <text x="0" y="8" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="23" font-weight="700" fill="#3730a3">实验验证</text>
    </g>
  </g>

  <!-- 箭头 2→3 -->
  <line x1="740" y1="324" x2="816" y2="324" stroke="#4f46e5" stroke-width="3.4" marker-end="url(#arrow)"/>
  <circle cx="778" cy="324" r="4" fill="#4f46e5"/>

  <!-- 卡3 论文产出 -->
  <g transform="translate(832,206)" filter="url(#cardShadow)">
    <rect width="264" height="236" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <g transform="translate(64,22)">
      <!-- 论文 -->
      <rect x="0" y="0" width="112" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.4"/>
      <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round">
        <line x1="18" y1="24" x2="94" y2="24"/>
        <line x1="18" y1="42" x2="88" y2="42"/>
        <line x1="18" y1="60" x2="94" y2="60"/>
        <line x1="18" y1="78" x2="70" y2="78"/>
      </g>
      <!-- 笔 -->
      <g transform="translate(58,52) rotate(45)">
        <rect x="-7" y="-52" width="14" height="64" rx="4" fill="#6d28d9"/>
        <path d="M-7 12 L 0 30 L 7 12 Z" fill="#6d28d9"/>
        <rect x="-7" y="-56" width="14" height="10" rx="3" fill="#4f46e5"/>
      </g>
      <!-- 通过标记（压文档右上角） -->
      <g transform="translate(100,0)">
        <circle r="19" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
        <path d="M-8 1 L -2 8 L 9 -6" stroke="#047857" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <g transform="translate(132,168)">
      <rect x="-62" y="-18" width="124" height="38" rx="8" fill="#eef2ff"/>
      <text x="0" y="8" text-anchor="middle" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="23" font-weight="700" fill="#3730a3">论文产出</text>
    </g>
  </g>

  <!-- 底部字标（逐字对照正文定稿口径：展示名 AI Research Skills；维护方 Orchestra Research） -->
  <g transform="translate(84,524)">
    <text font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#0f172a">AI Research Skills</text>
    <text x="322" y="0" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#64748b">Orchestra Research</text>
  </g>
  <!-- 右下点缀：小箭头流，呼应流程语义 -->
  <g transform="translate(1020,516)" stroke="#818cf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="8" x2="26" y2="8"/>
    <line x1="34" y1="8" x2="60" y2="8" stroke-dasharray="5 6"/>
    <path d="M66 2 L 78 8 L 66 14" fill="none"/>
  </g>
</svg>
