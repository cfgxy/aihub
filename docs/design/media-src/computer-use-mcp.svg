<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#d7e3f4"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- ===== 后层窗口（含截屏取景框） ===== -->
  <g>
    <rect x="668" y="92" width="372" height="242" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/>
    <circle cx="696" cy="116" r="5" fill="#93c5fd"/>
    <circle cx="714" cy="116" r="5" fill="#93c5fd"/>
    <circle cx="732" cy="116" r="5" fill="#93c5fd"/>
    <!-- 折线图示意 -->
    <rect x="706" y="138" width="170" height="78" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <polyline points="718,200 746,172 772,186 802,156 830,168 860,150" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 截屏取景角标 -->
    <g stroke="#1d4ed8" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M694 142 v-10 a6 6 0 0 1 6 -6 h10"/>
      <path d="M868 126 h10 a6 6 0 0 1 6 6 v10"/>
      <path d="M884 196 v10 a6 6 0 0 1 -6 6 h-10"/>
      <path d="M710 212 h-10 a6 6 0 0 1 -6 -6 v-10"/>
    </g>
    <!-- 右侧列表条 -->
    <rect x="902" y="150" width="112" height="10" rx="5" fill="#bfdbfe"/>
    <rect x="902" y="172" width="96" height="10" rx="5" fill="#dbeafe"/>
    <rect x="902" y="194" width="104" height="10" rx="5" fill="#dbeafe"/>
  </g>

  <!-- ===== 无障碍控件树（左上） ===== -->
  <g>
    <line x1="312" y1="176" x2="258" y2="244" stroke="#bfdbfe" stroke-width="2.5"/>
    <line x1="328" y1="176" x2="382" y2="244" stroke="#bfdbfe" stroke-width="2.5"/>
    <rect x="298" y="150" width="30" height="30" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="252" cy="262" r="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
    <circle cx="388" cy="262" r="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
    <line x1="388" y1="280" x2="388" y2="306" stroke="#bfdbfe" stroke-width="2.5"/>
    <circle cx="388" cy="322" r="13" fill="#dbeafe"/>
    <line x1="252" y1="280" x2="252" y2="306" stroke="#bfdbfe" stroke-width="2.5"/>
    <circle cx="252" cy="322" r="13" fill="#dbeafe"/>
  </g>

  <!-- ===== 中层窗口 ===== -->
  <g>
    <rect x="538" y="236" width="416" height="280" rx="14" fill="#0f172a" opacity="0.07" filter="url(#soft)"/>
    <rect x="530" y="226" width="416" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="558" cy="250" r="5" fill="#cbd5e1"/>
    <circle cx="576" cy="250" r="5" fill="#cbd5e1"/>
    <circle cx="594" cy="250" r="5" fill="#cbd5e1"/>
    <rect x="554" y="272" width="170" height="12" rx="6" fill="#94a3b8"/>
    <rect x="554" y="300" width="356" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="554" y="322" width="320" height="10" rx="5" fill="#e2e8f0"/>
    <!-- 无障碍控件树提示：虚线框住可点击控件 -->
    <rect x="554" y="348" width="120" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="690" y="348" width="120" height="30" rx="8" fill="#f1f5f9"/>
    <rect x="554" y="394" width="356" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="554" y="416" width="286" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="554" y="440" width="200" height="26" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="770" y="440" width="140" height="26" rx="8" fill="#e2e8f0"/>
  </g>

  <!-- ===== 前层窗口 + 权限边界 ===== -->
  <rect x="742" y="296" width="404" height="262" rx="18" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="10 7"/>
  <g>
    <rect x="768" y="322" width="10" height="10" fill="none"/>
    <rect x="778" y="326" width="330" height="208" rx="12" fill="#0f172a" opacity="0.07" filter="url(#soft)" transform="translate(8 10)"/>
    <rect x="778" y="326" width="330" height="208" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="804" cy="350" r="5" fill="#cbd5e1"/>
    <circle cx="822" cy="350" r="5" fill="#cbd5e1"/>
    <circle cx="840" cy="350" r="5" fill="#cbd5e1"/>
    <!-- 主按钮（光标点击目标） -->
    <rect x="802" y="382" width="132" height="38" rx="9" fill="#4f46e5"/>
    <rect x="802" y="440" width="220" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="802" y="462" width="180" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="802" y="492" width="96" height="26" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  </g>

  <!-- 点击波纹 + 光标 -->
  <g fill="none" stroke="#818cf8">
    <circle cx="918" cy="404" r="14" stroke-width="3" opacity="0.55"/>
    <circle cx="918" cy="404" r="26" stroke-width="2.5" opacity="0.3"/>
  </g>
  <g>
    <path d="M926 408 l58 22 -25 9 -9 25 Z" fill="#4f46e5" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- 权限盾牌（含 profile 档位点） -->
  <g>
    <path d="M1104 268 c18 8 34 10 34 10 v34 c0 26 -16 42 -34 50 c-18 -8 -34 -24 -34 -50 v-34 s16 -2 34 -10 Z" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <path d="M1088 318 l12 12 22 -24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1094" cy="344" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="1106" cy="344" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="1118" cy="344" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ===== 跨平台抽象拼块（无品牌 Logo） ===== -->
  <g stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 7" fill="none" stroke-linecap="round">
    <path d="M420 470 C500 500 540 480 560 452"/>
  </g>
  <g>
    <rect x="212" y="404" width="92" height="92" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
    <g fill="#2563eb">
      <rect x="234" y="426" width="21" height="21" rx="4"/>
      <rect x="261" y="426" width="21" height="21" rx="4"/>
      <rect x="234" y="453" width="21" height="21" rx="4"/>
      <rect x="261" y="453" width="21" height="21" rx="4"/>
    </g>
    <rect x="330" y="404" width="92" height="92" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
    <path d="M352 430 l22 18 -22 18" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="382" y="462" width="24" height="7" rx="3.5" fill="#2563eb"/>
    <rect x="448" y="404" width="92" height="92" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
    <g stroke="#2563eb" stroke-width="6" stroke-linecap="round">
      <line x1="468" y1="430" x2="520" y2="430"/>
      <line x1="468" y1="450" x2="520" y2="450"/>
      <line x1="468" y1="470" x2="520" y2="470"/>
    </g>
    <circle cx="508" cy="430" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
    <circle cx="480" cy="450" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
    <circle cx="496" cy="470" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  </g>

  <!-- ===== 点缀 ===== -->
  <g stroke="#bfdbfe" stroke-width="3" stroke-linecap="round">
    <path d="M148 140 v24 M136 152 h24"/>
    <path d="M1084 540 v20 M1074 550 h20"/>
  </g>
  <circle cx="200" cy="330" r="6" fill="#bfdbfe"/>
  <circle cx="1130" cy="170" r="5" fill="#93c5fd"/>
  <circle cx="620" cy="92" r="5" fill="#93c5fd"/>
</svg>
